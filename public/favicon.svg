<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Background Gradient: Pink -> Lilac -> Purple -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f43f5e" />
      <stop offset="25%" stop-color="#ec4899" />
      <stop offset="60%" stop-color="#a855f7" />
      <stop offset="100%" stop-color="#6366f1" />
    </linearGradient>

    <!-- Camera Body Metallic/Glow Gradient -->
    <linearGradient id="cameraGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="40%" stop-color="#fdf4ff" />
      <stop offset="100%" stop-color="#f5d0fe" />
    </linearGradient>

    <!-- Lens Gradient -->
    <linearGradient id="lensGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#c084fc" />
      <stop offset="50%" stop-color="#9333ea" />
      <stop offset="100%" stop-color="#4c1d95" />
    </linearGradient>

    <!-- Reel & Accent Gradient -->
    <linearGradient id="reelGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fb7185" />
      <stop offset="100%" stop-color="#d946ef" />
    </linearGradient>

    <!-- Soft Drop Shadow Filter -->
    <filter id="dropShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="14" stdDeviation="16" flood-color="#4c1d95" flood-opacity="0.4" />
    </filter>
    <filter id="innerGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#ffffff" flood-opacity="0.6" />
    </filter>
  </defs>

  <!-- Squircle Base with Pink-Lilac-Purple Gradient -->
  <rect x="24" y="24" width="464" height="464" rx="120" fill="url(#bgGrad)" />

  <!-- Subtle Rim Light / Inner Border -->
  <rect x="28" y="28" width="456" height="456" rx="116" fill="none" stroke="#ffffff" stroke-opacity="0.35" stroke-width="6" />

  <!-- Video Camera Group with Shadow -->
  <g filter="url(#dropShadow)">
    <!-- Top Reels / Film Circles (Classic Cinema Touch) -->
    <circle cx="165" cy="155" r="42" fill="url(#cameraGrad)" />
    <circle cx="165" cy="155" r="22" fill="url(#bgGrad)" />
    <circle cx="265" cy="155" r="42" fill="url(#cameraGrad)" />
    <circle cx="265" cy="155" r="22" fill="url(#bgGrad)" />

    <!-- Main Camera Body -->
    <rect x="95" y="195" width="220" height="175" rx="36" fill="url(#cameraGrad)" />

    <!-- Lens Cone / Projection Triangle -->
    <path d="M 320 235 L 415 175 C 424 170, 432 175, 432 186 L 432 378 C 432 389, 424 394, 415 389 L 320 329 Z" fill="url(#cameraGrad)" />

    <!-- Lens Inner Depth Accent -->
    <ellipse cx="420" cy="282" rx="7" ry="60" fill="url(#lensGrad)" />

    <!-- Center Camera Lens Display / Iris -->
    <circle cx="205" cy="282" r="50" fill="url(#lensGrad)" />
    <circle cx="205" cy="282" r="32" fill="#2e1065" />
    <circle cx="205" cy="282" r="16" fill="url(#reelGrad)" />

    <!-- Lens Glass Reflection Highlight -->
    <ellipse cx="192" cy="268" rx="12" ry="7" transform="rotate(-35 192 268)" fill="#ffffff" opacity="0.85" />

    <!-- Record Sparkle / Tally Light Indicator -->
    <circle cx="130" cy="230" r="10" fill="#f43f5e" />
    <circle cx="130" cy="230" r="5" fill="#ffffff" opacity="0.9" />

    <!-- Modern Play Indicator on Body -->
    <polygon points="290,274 290,290 302,282" fill="#a855f7" opacity="0.7" />
  </g>
</svg>
